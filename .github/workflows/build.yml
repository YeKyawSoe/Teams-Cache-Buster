name: build

on:
  push:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      SIGNING_TIMESTAMP_URL: ${{ secrets.SIGNING_TIMESTAMP_URL }}
      SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
      SIGNING_CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build artifacts
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "release") {
            ./scripts/build.ps1 -Configuration Release -RequireSigning
          } else {
            ./scripts/build.ps1 -Configuration Release
          }

      - name: Smoke test executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\TeamsCacheBuster\TeamsCacheBuster.exe"
          if (-not (Test-Path $exe)) {
            throw "Executable not found: $exe"
          }
          $proc = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            throw "Smoke test failed with exit code $($proc.ExitCode)"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TeamsCacheBuster-build
          path: artifacts/**

      - name: Upload onedir build
        uses: actions/upload-artifact@v4
        with:
          name: TeamsCacheBuster-ondir
          path: dist/TeamsCacheBuster/**

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/TeamsCacheBuster.msi
            artifacts/TeamsCacheBuster.sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
