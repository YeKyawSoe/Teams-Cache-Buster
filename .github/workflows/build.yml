name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Smoke test app startup
        run: python -m teams_cache_buster --smoke-test

  build:
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build the Windows app
        run: pwsh -File ./scripts/build.ps1 -Configuration Debug

      - name: Smoke test the built executable
        run: .\dist\TeamsCacheBuster\TeamsCacheBuster.exe --smoke-test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teams-cache-buster-windows-build
          path: |
            dist/TeamsCacheBuster/**
          if-no-files-found: error
